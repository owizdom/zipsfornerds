<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 358" width="960" height="358" role="img" aria-labelledby="t d">
<title id="t">One block in 75 seconds today, three blocks in the same time after the change</title><desc id="d">Today a first confirmation takes 75 seconds. At a 25-second target, three blocks arrive in that window and the first confirmation comes after 25 seconds.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="358" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 1 / THE SAME 75 SECONDS, BEFORE AND AFTER</text><text x="60" y="96" class="sb" text-anchor="start">Today</text><text x="60" y="120" class="xs" text-anchor="start">75-second target</text><line x1="250" y1="110" x2="910" y2="110" stroke="#16150f" stroke-width="1.5"/><rect x="250" y="88" width="46" height="44" fill="#2a78d6"/><text x="273" y="117" class="mi" text-anchor="middle" fill="#ffffff">1</text><text x="320" y="105" class="sm" text-anchor="start">one block. You wait the full 75 seconds</text><text x="320" y="127" class="sm" text-anchor="start">for a first confirmation, busy or idle.</text><text x="60" y="208" class="sb" text-anchor="start">NU7</text><text x="60" y="232" class="xs" text-anchor="start">25-second target</text><line x1="250" y1="222" x2="910" y2="222" stroke="#16150f" stroke-width="1.5"/><rect x="250" y="200" width="46" height="44" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="273" y="229" class="mi" text-anchor="middle">1</text><rect x="320" y="200" width="46" height="44" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="343" y="229" class="mi" text-anchor="middle">2</text><rect x="390" y="200" width="46" height="44" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="413" y="229" class="mi" text-anchor="middle">3</text><text x="480" y="217" class="sm" text-anchor="start">three blocks in the same window</text><text x="480" y="239" class="sm" text-anchor="start">first confirmation after 25 seconds</text><text x="250" y="290" class="m" text-anchor="start">0s</text><text x="910" y="290" class="m" text-anchor="end">75s</text><text x="480" y="334" class="sm" text-anchor="middle">ZIP 218: "The user-latency goes down 3x."</text></svg>