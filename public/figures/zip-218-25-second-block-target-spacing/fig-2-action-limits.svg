<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" width="960" height="368" role="img" aria-labelledby="t d">
<title id="t">Throughput rises while worst-case sync burden falls</title><desc id="d">Orchard throughput rises from 2.9 to 6.6 transactions per second while the maximum shielded sync bandwidth for light clients falls from 271 to 169 MB per day, a 37 percent reduction.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="368" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 2 / WHAT THE ACTION LIMITS DO (FIGURES FROM ZIP 218)</text><text x="60" y="96" class="sb" text-anchor="start">Orchard throughput</text><text x="60" y="120" class="xs" text-anchor="start">ordinary capacity, higher is better</text><rect x="440" y="80" width="131" height="34" rx="4" fill="#6a665a"/><text x="452" y="103" class="mi" text-anchor="start">2.9 TPS</text><rect x="440" y="124" width="300" height="34" rx="4" fill="#c98500"/><text x="452" y="147" class="mi" fill="#ffffff" text-anchor="start">6.6 TPS</text><text x="760" y="103" class="m" text-anchor="start">now</text><text x="760" y="147" class="m" text-anchor="start">NU7</text><line x1="60" y1="190" x2="900" y2="190" stroke="#6a665a" stroke-width="1" stroke-dasharray="4 5"/><text x="60" y="234" class="sb" text-anchor="start">Worst-case light client sync</text><text x="60" y="258" class="xs" text-anchor="start">under attempted DoS, lower is better</text><rect x="440" y="218" width="300" height="34" rx="4" fill="#6a665a"/><text x="452" y="241" class="mi" text-anchor="start">271 MB/day</text><rect x="440" y="262" width="187" height="34" rx="4" fill="#2a78d6"/><text x="452" y="285" class="mi" fill="#ffffff" text-anchor="start">169 MB/day</text><text x="760" y="241" class="m" text-anchor="start">now</text><text x="760" y="285" class="m" text-anchor="start">NU7, down 37%</text><text x="480" y="344" class="sm" text-anchor="middle">Ordinary capacity more than doubles while the attacker ceiling falls. They are different quantities.</text></svg>