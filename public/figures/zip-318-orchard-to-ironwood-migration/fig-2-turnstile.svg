<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 362" width="960" height="362" role="img" aria-labelledby="t d">
<title id="t">The turnstile between the Orchard and Ironwood pools</title><desc id="d">Inside each pool amounts, senders and receivers are hidden. The amount crossing between pools is public, which lets nodes count the supply.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker></defs>
<rect width="960" height="362" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}</style>
<text x="40" y="42" class="m">FIG. 2 / WHAT THE CHAIN SEES AT A TURNSTILE</text><rect x="50" y="80" width="300" height="210" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="200" y="116" class="sb" text-anchor="middle">Orchard pool</text><text x="200" y="140" class="m" text-anchor="middle">SEALED BY NU6.3</text><text x="200" y="188" class="sm" text-anchor="middle">amounts hidden</text><text x="200" y="214" class="sm" text-anchor="middle">senders hidden</text><text x="200" y="240" class="sm" text-anchor="middle">receivers hidden</text><rect x="610" y="80" width="300" height="210" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="760" y="116" class="sb" text-anchor="middle">Ironwood pool</text><text x="760" y="140" class="m" text-anchor="middle">NEW IN NU6.3</text><text x="760" y="188" class="sm" text-anchor="middle">amounts hidden</text><text x="760" y="214" class="sm" text-anchor="middle">senders hidden</text><text x="760" y="240" class="sm" text-anchor="middle">receivers hidden</text><line x1="350" y1="185" x2="606" y2="185" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><rect x="395" y="143" width="170" height="84" fill="#f4b728" stroke="#16150f" stroke-width="2"/><text x="480" y="174" class="m" text-anchor="middle" style="fill:#16150f">PUBLIC</text><text x="480" y="204" class="sb" text-anchor="middle">20 ZEC</text><text x="480" y="258" class="sm" text-anchor="middle">the crossing amount</text><text x="480" y="280" class="sm" text-anchor="middle">is visible to everyone</text><text x="480" y="336" class="sm" text-anchor="middle">Nodes count what enters and leaves each pool. Orchard can never pay out more than it took in.</text></svg>