<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 298" width="960" height="298" role="img" aria-labelledby="t d">
<title id="t">How 123.45 ZEC is broken into standard denominations</title><desc id="d">1 hundred becomes 100; 2 tens become 20; 3 ones become 2 and 1; 4 tenths become 0.2 and 0.2; 5 hundredths become 0.05.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker></defs>
<rect width="960" height="298" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}</style>
<text x="40" y="42" class="m">FIG. 5 / CANONICAL QUANTIZATION: EACH DIGIT BECOMES 5s, 2s AND 1s</text><text x="110" y="108" text-anchor="middle" style="font-family:Georgia, 'Times New Roman', serif;font-size:48px;font-weight:700;fill:#16150f">1</text><text x="110" y="136" class="m" text-anchor="middle">HUNDREDS</text><line x1="110" y1="148" x2="110" y2="178" stroke="#16150f" stroke-width="1.5" marker-end="url(#arr)"/><rect x="74" y="186" width="72" height="42" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="110" y="213" class="mi" text-anchor="middle">100</text><text x="290" y="108" text-anchor="middle" style="font-family:Georgia, 'Times New Roman', serif;font-size:48px;font-weight:700;fill:#16150f">2</text><text x="290" y="136" class="m" text-anchor="middle">TENS</text><line x1="290" y1="148" x2="290" y2="178" stroke="#16150f" stroke-width="1.5" marker-end="url(#arr)"/><rect x="254" y="186" width="72" height="42" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="290" y="213" class="mi" text-anchor="middle">20</text><text x="470" y="108" text-anchor="middle" style="font-family:Georgia, 'Times New Roman', serif;font-size:48px;font-weight:700;fill:#16150f">3</text><text x="470" y="136" class="m" text-anchor="middle">ONES</text><line x1="470" y1="148" x2="470" y2="178" stroke="#16150f" stroke-width="1.5" marker-end="url(#arr)"/><rect x="394" y="186" width="72" height="42" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="430" y="213" class="mi" text-anchor="middle">2</text><rect x="474" y="186" width="72" height="42" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="510" y="213" class="mi" text-anchor="middle">1</text><text x="650" y="108" text-anchor="middle" style="font-family:Georgia, 'Times New Roman', serif;font-size:48px;font-weight:700;fill:#16150f">4</text><text x="650" y="136" class="m" text-anchor="middle">TENTHS</text><line x1="650" y1="148" x2="650" y2="178" stroke="#16150f" stroke-width="1.5" marker-end="url(#arr)"/><rect x="574" y="186" width="72" height="42" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="610" y="213" class="mi" text-anchor="middle">0.2</text><rect x="654" y="186" width="72" height="42" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="690" y="213" class="mi" text-anchor="middle">0.2</text><text x="830" y="108" text-anchor="middle" style="font-family:Georgia, 'Times New Roman', serif;font-size:48px;font-weight:700;fill:#16150f">5</text><text x="830" y="136" class="m" text-anchor="middle">HUNDREDTHS</text><line x1="830" y1="148" x2="830" y2="178" stroke="#16150f" stroke-width="1.5" marker-end="url(#arr)"/><rect x="794" y="186" width="72" height="42" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="830" y="213" class="mi" text-anchor="middle">0.05</text><text x="560" y="108" text-anchor="middle" style="font-family:Georgia, 'Times New Roman', serif;font-size:48px;font-weight:700;fill:#16150f">.</text><text x="480" y="270" class="sm" text-anchor="middle">123.45 ZEC becomes seven transfers. Anything below 0.01 ZEC stays behind in Orchard as the residual.</text></svg>