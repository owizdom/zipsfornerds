<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 298" width="960" height="298" role="img" aria-labelledby="t d">
<title id="t">A naive migration compared with a ZIP 318 migration</title><desc id="d">A naive migration publishes 123.45 ZEC in one transfer. ZIP 318 sends seven standard amounts in shuffled order at random intervals.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker></defs>
<rect width="960" height="298" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}</style>
<text x="40" y="42" class="m">FIG. 3 / THE SAME 123.45 ZEC, CROSSING TWO WAYS</text><text x="40" y="92" class="sb">Naive</text><text x="40" y="116" class="sm">one transfer, one block</text><line x1="250" y1="104" x2="920" y2="104" stroke="#16150f" stroke-width="1.5"/><rect x="300" y="80" width="150" height="48" fill="#2a78d6"/><text x="375" y="110" class="mi" text-anchor="middle" style="fill:#fff">123.45 ZEC</text><text x="468" y="96" class="sm">the whole balance,</text><text x="468" y="118" class="sm">published at once</text><text x="40" y="196" class="sb">ZIP 318</text><text x="40" y="220" class="sm">seven standard amounts,</text><text x="40" y="242" class="sm">random gaps, over hours</text><line x1="250" y1="212" x2="920" y2="212" stroke="#16150f" stroke-width="1.5"/><rect x="265" y="192" width="58" height="40" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="294" y="218" class="mi" text-anchor="middle">2</text><rect x="345" y="192" width="58" height="40" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="374" y="218" class="mi" text-anchor="middle">0.2</text><rect x="460" y="192" width="58" height="40" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="489" y="218" class="mi" text-anchor="middle">100</text><rect x="530" y="192" width="58" height="40" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="559" y="218" class="mi" text-anchor="middle">0.05</text><rect x="650" y="192" width="58" height="40" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="679" y="218" class="mi" text-anchor="middle">20</text><rect x="750" y="192" width="58" height="40" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="779" y="218" class="mi" text-anchor="middle">1</text><rect x="858" y="192" width="58" height="40" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="887" y="218" class="mi" text-anchor="middle">0.2</text><text x="250" y="272" class="m">TIME →</text><text x="920" y="272" class="m" text-anchor="end">EACH AMOUNT MATCHES TRANSFERS FROM OTHER WALLETS</text></svg>