<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 324" width="960" height="324" role="img" aria-labelledby="t d">
<title id="t">How a wallet picks a shared anchor boundary</title><desc id="d">The newest boundary is never used. Ages one to four are chosen with odds of about 53, 27, 13 and 7 percent. Older boundaries are never used.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker></defs>
<rect width="960" height="324" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}</style>
<text x="40" y="42" class="m">FIG. 7 / CHOOSING AN ANCHOR FROM SHARED BOUNDARIES (ONE EVERY 144 BLOCKS, ABOUT 3 HOURS)</text><line x1="60" y1="220" x2="920" y2="220" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><line x1="120" y1="212" x2="120" y2="228" stroke="#16150f" stroke-width="2"/><text x="120" y="256" class="m" text-anchor="middle">AGE 5</text><line x1="270" y1="212" x2="270" y2="228" stroke="#16150f" stroke-width="2"/><text x="270" y="256" class="m" text-anchor="middle">AGE 4</text><rect x="242" y="196" width="56" height="14" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="270" y="186" class="mi" text-anchor="middle">6.7%</text><line x1="420" y1="212" x2="420" y2="228" stroke="#16150f" stroke-width="2"/><text x="420" y="256" class="m" text-anchor="middle">AGE 3</text><rect x="392" y="182" width="56" height="28" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="420" y="172" class="mi" text-anchor="middle">13.3%</text><line x1="570" y1="212" x2="570" y2="228" stroke="#16150f" stroke-width="2"/><text x="570" y="256" class="m" text-anchor="middle">AGE 2</text><rect x="542" y="154" width="56" height="56" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="570" y="144" class="mi" text-anchor="middle">26.7%</text><line x1="720" y1="212" x2="720" y2="228" stroke="#16150f" stroke-width="2"/><text x="720" y="256" class="m" text-anchor="middle">AGE 1</text><rect x="692" y="98" width="56" height="112" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="720" y="88" class="mi" text-anchor="middle">53.3%</text><line x1="870" y1="212" x2="870" y2="228" stroke="#16150f" stroke-width="2"/><text x="870" y="256" class="m" text-anchor="middle">NEWEST</text><text x="120" y="180" class="sm" text-anchor="middle">beyond the cap,</text><text x="120" y="202" class="sm" text-anchor="middle">never used</text><text x="870" y="180" class="sm" text-anchor="middle">excluded,</text><text x="870" y="202" class="sm" text-anchor="middle">never used</text><text x="480" y="298" class="sm" text-anchor="middle">Age is drawn from a geometric distribution (p = 1/2) and redrawn above the cap of 4. Bars show the odds.</text></svg>