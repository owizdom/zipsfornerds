<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 275" width="960" height="275" role="img" aria-labelledby="t d">
<title id="t">Timeline from the Orchard bug report to Ironwood</title><desc id="d">29 May 2026 flaw reported; block 3,363,426 Orchard switched off; 3 June NU6.2 corrected circuit; 28 July NU6.3 opens Ironwood and seals Orchard.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker></defs>
<rect width="960" height="275" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}</style>
<text x="40" y="42" class="m">FIG. 1 / FROM BUG REPORT TO IRONWOOD, 2026</text><line x1="60" y1="150" x2="900" y2="150" stroke="#16150f" stroke-width="2"/><circle cx="110" cy="150" r="9" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="110" y="116" class="m" text-anchor="middle">29 MAY</text><text x="110" y="194" class="sb" text-anchor="middle">Flaw reported</text><text x="110" y="220" class="sm" text-anchor="middle">Taylor Hornby reports a</text><text x="110" y="242" class="sm" text-anchor="middle">soundness bug in Orchard</text><circle cx="345" cy="150" r="9" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="345" y="116" class="m" text-anchor="middle">BLOCK 3,363,426</text><text x="345" y="194" class="sb" text-anchor="middle">Orchard switched off</text><text x="345" y="220" class="sm" text-anchor="middle">Emergency soft fork</text><text x="345" y="242" class="sm" text-anchor="middle">bans Orchard actions</text><circle cx="580" cy="150" r="9" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="580" y="116" class="m" text-anchor="middle">3 JUNE · 3,364,600</text><text x="580" y="194" class="sb" text-anchor="middle">NU6.2</text><text x="580" y="220" class="sm" text-anchor="middle">Orchard back on with</text><text x="580" y="242" class="sm" text-anchor="middle">a corrected circuit</text><circle cx="815" cy="150" r="9" fill="#f4b728" stroke="#16150f" stroke-width="2"/><text x="815" y="116" class="m" text-anchor="middle">28 JULY · 3,428,143</text><text x="815" y="194" class="sb" text-anchor="middle">NU6.3</text><text x="815" y="220" class="sm" text-anchor="middle">Ironwood opens,</text><text x="815" y="242" class="sm" text-anchor="middle">Orchard is sealed</text></svg>