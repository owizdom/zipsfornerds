<text x="40" y="42" class="m">FIG. 9 / HOW MUCH OF ORCHARD HAS CROSSED (CIPHERSCAN, 20 SEPT 2026)</text><text x="60" y="92" class="sb">3,223,060 ZEC migrated to Ironwood</text><text x="900" y="92" class="sb" text-anchor="end">410,123 ZEC still in Orchard</text><rect x="60" y="108" width="745" height="46" rx="4" fill="#c98500"/><rect x="807" y="108" width="93" height="46" rx="4" fill="#2a78d6"/><text x="60" y="182" class="m">88.7% OF THE ORCHARD SUPPLY</text><text x="900" y="182" class="m" text-anchor="end">11.3%</text></svg>