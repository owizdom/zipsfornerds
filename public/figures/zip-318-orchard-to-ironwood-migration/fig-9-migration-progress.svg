<title id="t">Share of the Orchard supply that has migrated to Ironwood</title><desc id="d">3,223,060 ZEC, 88.7 percent of the Orchard supply, has migrated to Ironwood. 410,123 ZEC, 11.3 percent, remains in Orchard. Source CipherScan, 20 September 2026.</desc>
