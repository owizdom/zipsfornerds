<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" width="960" height="424" role="img" aria-labelledby="t d">
<title id="t">Results of the September 2026 coinholder poll</title><desc id="d">Coinholders voted 98.9 percent to keep Bitcoin-style halvings, 96.6 percent to delay NSM reissuance until February 2031, and 99.9 percent to cut the block target to 25 seconds.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="424" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 3 / WHAT COINHOLDERS DECIDED, SEPTEMBER 2026</text><text x="60" y="92" class="sb" text-anchor="start">Keep Bitcoin-style halvings</text><rect x="60" y="106" width="600" height="26" rx="4" fill="#ebe3d2"/><rect x="60" y="106" width="593" height="26" rx="4" fill="#c98500"/><text x="676" y="126" class="mi" text-anchor="start">98.9%</text><text x="60" y="154" class="xs" text-anchor="start">rejects the smoothed curve</text><text x="60" y="188" class="sb" text-anchor="start">Delay NSM reissuance to February 2031</text><rect x="60" y="202" width="600" height="26" rx="4" fill="#ebe3d2"/><rect x="60" y="202" width="579" height="26" rx="4" fill="#c98500"/><text x="676" y="222" class="mi" text-anchor="start">96.6%</text><text x="60" y="250" class="xs" text-anchor="start">removals would have no route back until then</text><text x="60" y="284" class="sb" text-anchor="start">Cut block target to 25 seconds (ZIP 218)</text><rect x="60" y="298" width="600" height="26" rx="4" fill="#ebe3d2"/><rect x="60" y="298" width="599" height="26" rx="4" fill="#6a665a"/><text x="676" y="318" class="mi" text-anchor="start">99.9%</text><text x="60" y="346" class="xs" text-anchor="start">for comparison, the same ballot</text><text x="480" y="400" class="sm" text-anchor="middle">About 2.4 million ZEC took part. Percentages are of participating ZEC.</text></svg>