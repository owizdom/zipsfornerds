<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-labelledby="t d">
<title id="t">The block subsidy is a fixed fraction of the Money Reserve</title><desc id="d">Each block pays a fixed fraction of the Money Reserve. Removing coins enlarges the reserve, which raises future subsidies, so removed funds are reissued automatically.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="372" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 2 / WHY THE CURVE CAN REISSUE REMOVED COINS</text><rect x="300" y="78" width="360" height="80" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="480" y="110" class="sb" text-anchor="middle">Money Reserve</text><text x="480" y="136" class="xs" text-anchor="middle">what MAX_MONEY allows, minus what exists</text><line x1="480" y1="162" x2="480" y2="212" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><rect x="300" y="216" width="360" height="80" fill="#f4b728" stroke="#16150f" stroke-width="2"/><text x="480" y="248" class="sb" text-anchor="middle">Block subsidy</text><text x="480" y="274" class="xs" text-anchor="middle">0.0000004126 of the reserve, each block</text><path d="M300 256 Q150 256 150 118 Q150 118 296 118" fill="none" stroke="#c98500" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrx)"/><text x="70" y="190" class="sb" text-anchor="start">ZIP 233</text><text x="70" y="214" class="xs" text-anchor="start">removals enlarge</text><text x="70" y="234" class="xs" text-anchor="start">the reserve</text><rect x="700" y="216" width="200" height="80" fill="#f6f1e7" stroke="#16150f" stroke-width="2" stroke-dasharray="6 5"/><text x="800" y="248" class="sm" text-anchor="middle">issued supply</text><text x="800" y="272" class="xs" text-anchor="middle">approaches the cap,</text><text x="800" y="290" class="xs" text-anchor="middle">never crosses it</text><line x1="665" y1="256" x2="696" y2="256" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><text x="480" y="348" class="sm" text-anchor="middle">One constant gives smooth decline, a preserved cap, no terminal block and automatic reissuance.</text></svg>