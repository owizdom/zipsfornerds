<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 358" width="960" height="358" role="img" aria-labelledby="t d">
<title id="t">Outputs carry a 32-byte key pointing into a shared memo bundle</title><desc id="d">Each shielded output carries a 32-byte memo key instead of an inline memo. The keys unlock chunks of a single shared memo bundle of up to 64 chunks, or 16 KiB.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="358" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 2 / THE MEMO MOVES OUT OF THE OUTPUT</text><rect x="70" y="86" width="300" height="76" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="220" y="120" class="sb" text-anchor="middle">Shielded output 1</text><text x="220" y="146" class="mi" text-anchor="middle">memo key, 32 bytes</text><rect x="70" y="182" width="300" height="76" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="220" y="216" class="sb" text-anchor="middle">Shielded output 2</text><text x="220" y="242" class="mi" text-anchor="middle">memo key, 32 bytes</text><line x1="378" y1="124" x2="470" y2="170" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><line x1="378" y1="220" x2="470" y2="194" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><rect x="478" y="86" width="412" height="178" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="684" y="120" class="sb" text-anchor="middle">Memo bundle</text><text x="684" y="144" class="xs" text-anchor="middle">one per transaction</text><rect x="502" y="166" width="82" height="52" fill="#f4b728" stroke="#16150f" stroke-width="1.2"/><text x="543" y="190" class="xs" text-anchor="middle">chunk</text><text x="543" y="210" class="xs" text-anchor="middle">272 B</text><rect x="600" y="166" width="82" height="52" fill="#f4b728" stroke="#16150f" stroke-width="1.2"/><text x="641" y="190" class="xs" text-anchor="middle">chunk</text><text x="641" y="210" class="xs" text-anchor="middle">272 B</text><rect x="698" y="166" width="82" height="52" fill="#f6f1e7" stroke="#16150f" stroke-width="1.2" stroke-dasharray='5 4'/><text x="739" y="190" class="xs" text-anchor="middle">chunk</text><text x="739" y="210" class="xs" text-anchor="middle">272 B</text><rect x="796" y="166" width="82" height="52" fill="#f6f1e7" stroke="#16150f" stroke-width="1.2" stroke-dasharray='5 4'/><text x="837" y="190" class="xs" text-anchor="middle">chunk</text><text x="837" y="210" class="xs" text-anchor="middle">272 B</text><text x="684" y="246" class="xs" text-anchor="middle">up to 64 chunks, so 16 KiB of memo per transaction</text><text x="480" y="306" class="sm" text-anchor="middle">Each chunk encrypts 256 bytes. Two chunks are free when a transaction has shielded outputs; beyond that you pay.</text><text x="480" y="334" class="sm" text-anchor="middle">The same two-output transaction drops from 1024 bytes to about 576.</text></svg>