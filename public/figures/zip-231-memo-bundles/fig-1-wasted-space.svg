<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 386" width="960" height="386" role="img" aria-labelledby="t d">
<title id="t">Both padded outputs carry a full 512-byte memo field</title><desc id="d">An ordinary shielded transaction is padded to two outputs. Each carries a fixed 512-byte memo field, so 1024 bytes are spent even when at most one memo is written.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="386" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 1 / WHERE THE 1024 BYTES GO TODAY</text><rect x="90" y="82" width="360" height="210" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="270" y="118" class="sb" text-anchor="middle">Shielded output 1</text><rect x="120" y="140" width="300" height="34" fill="#ebe3d2" stroke="#16150f" stroke-width="1.2"/><text x="270" y="163" class="xs" text-anchor="middle">note plaintext, 52 bytes</text><rect x="120" y="182" width="300" height="70" fill="#f4b728" stroke="#16150f" stroke-width="1.2"/><text x="270" y="212" class="mi" text-anchor="middle">memo field, 512 bytes</text><text x="270" y="238" class="xs" text-anchor="middle">your memo</text><text x="270" y="276" class="xs" text-anchor="middle">paid for either way</text><rect x="510" y="82" width="360" height="210" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="690" y="118" class="sb" text-anchor="middle">Shielded output 2</text><rect x="540" y="140" width="300" height="34" fill="#ebe3d2" stroke="#16150f" stroke-width="1.2"/><text x="690" y="163" class="xs" text-anchor="middle">note plaintext, 52 bytes</text><rect x="540" y="182" width="300" height="70" fill="#f6f1e7" stroke="#16150f" stroke-width="1.2" stroke-dasharray='6 5'/><text x="690" y="212" class="mi" text-anchor="middle">memo field, 512 bytes</text><text x="690" y="238" class="xs" text-anchor="middle">empty, padded</text><text x="690" y="276" class="xs" text-anchor="middle">paid for either way</text><text x="480" y="334" class="sm" text-anchor="middle">Wallets pad to two outputs so a payment with change looks like one without. Both carry the full field.</text><text x="480" y="362" class="sm" text-anchor="middle">1024 bytes of memo space. ZIP 231: "most of this data space is wasted".</text></svg>