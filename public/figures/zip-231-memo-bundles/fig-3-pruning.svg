<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 338" width="960" height="338" role="img" aria-labelledby="t d">
<title id="t">A node can replace the memo bundle with a digest and still validate</title><desc id="d">Memo bundles are prunable. A node may replace the entire bundle with a single digest and still validate the transaction, because consensus commits to the digest.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="338" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 3 / MEMO DATA CAN BE REPLACED BY A DIGEST</text><text x="60" y="96" class="sb" text-anchor="start">Node that keeps memos</text><rect x="380" y="76" width="64" height="44" fill="#f4b728" stroke="#16150f" stroke-width="1.2"/><rect x="456" y="76" width="64" height="44" fill="#f4b728" stroke="#16150f" stroke-width="1.2"/><rect x="532" y="76" width="64" height="44" fill="#f4b728" stroke="#16150f" stroke-width="1.2"/><rect x="608" y="76" width="64" height="44" fill="#f4b728" stroke="#16150f" stroke-width="1.2"/><rect x="684" y="76" width="64" height="44" fill="#f4b728" stroke="#16150f" stroke-width="1.2"/><text x="838" y="103" class="xs" text-anchor="start">full bundle</text><text x="60" y="196" class="sb" text-anchor="start">Node that prunes</text><rect x="380" y="176" width="140" height="44" fill="#ebe3d2" stroke="#16150f" stroke-width="1.5"/><text x="450" y="204" class="mi" text-anchor="middle">digest</text><rect x="520" y="176" width="0" height="44"/><rect x="596" y="176" width="0" height="44"/><rect x="672" y="176" width="0" height="44"/><rect x="748" y="176" width="0" height="44"/><text x="540" y="203" class="xs" text-anchor="start">the bytes are gone</text><circle cx="700" cy="198" r="13" fill="#f4b728" stroke="#16150f" stroke-width="2"/><path d="M694 198L699 203L706 193" fill="none" stroke="#16150f" stroke-width="2.2"/><text x="790" y="203" class="sm" text-anchor="start">still validates</text><text x="480" y="286" class="sm" text-anchor="middle">Consensus commits to the digest, so a node can discard memo data and still validate the chain.</text><text x="480" y="314" class="sm" text-anchor="middle">The trade: memo history survives only where someone chose to keep it.</text></svg>