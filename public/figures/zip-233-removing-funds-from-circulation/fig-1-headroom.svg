<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 428" width="960" height="428" role="img" aria-labelledby="t d">
<title id="t">Removing ZEC creates headroom below the unchanged 21 million cap</title><desc id="d">Schematic, not to scale. The MAX_MONEY cap of 21 million ZEC does not move. Removing coins from circulation widens the gap between issued supply and the cap, and that gap can fund future block subsidies.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="428" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 1 / HEADROOM UNDER THE CAP</text><line x1="70" y1="86" x2="890" y2="86" stroke="#16150f" stroke-width="2.5"/><text x="70" y="76" class="sm" text-anchor="start">MAX_MONEY, 21 million ZEC. This line never moves.</text><rect x="120" y="120" width="260" height="190" fill="#6a665a"/><text x="250" y="230" class="mi" fill="#ffffff" text-anchor="middle">issued</text><rect x="120" y="96" width="260" height="24" fill="none" stroke="#6a665a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="250" y="340" class="sb" text-anchor="middle">Before</text><text x="250" y="364" class="xs" text-anchor="middle">issuance approaches the cap</text><line x1="410" y1="210" x2="500" y2="210" stroke="#c98500" stroke-width="2" marker-end="url(#arrx)"/><text x="455" y="194" class="m" text-anchor="middle">remove</text><rect x="530" y="180" width="260" height="130" fill="#6a665a"/><text x="660" y="252" class="mi" fill="#ffffff" text-anchor="middle">issued</text><rect x="530" y="96" width="260" height="84" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="660" y="144" class="mi" text-anchor="middle">headroom</text><text x="660" y="340" class="sb" text-anchor="middle">After removals</text><text x="660" y="364" class="xs" text-anchor="middle">space that future subsidies can use</text><text x="480" y="404" class="sm" text-anchor="middle">Schematic, not to scale. The cap is not raised; the space beneath it is reopened.</text></svg>