<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
<title id="t">The three ZIPs of the Network Sustainability Mechanism form a loop</title><desc id="d">ZIP 235 takes 60 percent of transaction fees, ZIP 233 removes them from circulation, and ZIP 234 reissues them through future block subsidies.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="400" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 3 / THE NETWORK SUSTAINABILITY MECHANISM, AS THREE ZIPS</text><rect x="330" y="92" width="300" height="76" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="480" y="124" class="sb" text-anchor="middle">ZIP 235</text><text x="480" y="150" class="xs" text-anchor="middle">takes 60% of transaction fees</text><rect x="80" y="250" width="280" height="76" fill="#f4b728" stroke="#16150f" stroke-width="2"/><text x="220" y="282" class="sb" text-anchor="middle">ZIP 233</text><text x="220" y="308" class="xs" text-anchor="middle">removes it from circulation</text><rect x="600" y="250" width="280" height="76" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="740" y="282" class="sb" text-anchor="middle">ZIP 234</text><text x="740" y="308" class="xs" text-anchor="middle">reissues it as block subsidy</text><line x1="330" y1="140" x2="240" y2="246" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><line x1="362" y1="288" x2="596" y2="288" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><line x1="800" y1="246" x2="630" y2="150" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><text x="480" y="376" class="sm" text-anchor="middle">ZIP 233 is the opening in the side of the loop. On its own, nothing closes it.</text></svg>