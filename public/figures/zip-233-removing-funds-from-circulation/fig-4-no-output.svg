<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
<title id="t">A removal creates no output in any pool</title><desc id="d">An ordinary transfer moves value from one pool to another and creates an output. A ZIP 233 removal creates no output in any pool, so the amount is subtracted from the issued supply.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="330" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 4 / AN ORDINARY TRANSFER VERSUS A REMOVAL</text><text x="60" y="96" class="sb" text-anchor="start">Ordinary transfer</text><rect x="250" y="76" width="180" height="64" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="340" y="114" class="sm" text-anchor="middle">pool A</text><line x1="435" y1="108" x2="520" y2="108" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><text x="478" y="96" class="m" text-anchor="middle">20 ZEC</text><rect x="525" y="76" width="180" height="64" fill="#f4b728" stroke="#16150f" stroke-width="2"/><text x="615" y="114" class="sm" text-anchor="middle">pool B</text><text x="730" y="114" class="xs" text-anchor="start">output created</text><text x="60" y="212" class="sb" text-anchor="start">ZIP 233 removal</text><rect x="250" y="192" width="180" height="64" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="340" y="230" class="sm" text-anchor="middle">pool A</text><line x1="435" y1="224" x2="520" y2="224" stroke="#c98500" stroke-width="2" marker-end="url(#arrx)"/><text x="478" y="212" class="m" text-anchor="middle">20 ZEC</text><rect x="525" y="192" width="180" height="64" fill="#f6f1e7" stroke="#16150f" stroke-width="2" stroke-dasharray="6 5"/><circle cx="615" cy="224" r="13" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><path d="M609 218L621 230M621 218L609 230" stroke="#16150f" stroke-width="2.2"/><text x="730" y="218" class="xs" text-anchor="start">no output, anywhere.</text><text x="730" y="240" class="xs" text-anchor="start">subtracted from issued supply</text><text x="480" y="306" class="sm" text-anchor="middle">No new proof and no new signature: a bundle type with no effecting and no authorizing data.</text></svg>