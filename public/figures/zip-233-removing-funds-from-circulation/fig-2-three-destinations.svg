<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 366" width="960" height="366" role="img" aria-labelledby="t d">
<title id="t">Three possible destinations for removed coins</title><desc id="d">Removed coins could be destroyed forever, held in a controlled reserve, or reissued automatically through future block subsidies. ZIP 233 intends the third.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="366" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 2 / THREE THINGS YOU CAN DO WITH REMOVED COINS</text><rect x="50" y="84" width="260" height="210" fill="#f6f1e7" stroke="#16150f" stroke-width="2" stroke-dasharray="6 5"/><text x="180" y="126" class="sb" text-anchor="middle">Destroy them</text><text x="180" y="176" class="sm" text-anchor="middle">Supply shrinks forever.</text><text x="180" y="200" class="sm" text-anchor="middle">Holders gain, security budget does not.</text><circle cx="180" cy="252" r="13" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><path d="M174 246L186 258M186 246L174 258" stroke="#16150f" stroke-width="2.2"/><rect x="350" y="84" width="260" height="210" fill="#f6f1e7" stroke="#16150f" stroke-width="2" stroke-dasharray="6 5"/><text x="480" y="126" class="sb" text-anchor="middle">Hold them in a reserve</text><text x="480" y="176" class="sm" text-anchor="middle">Funds the network, but creates</text><text x="480" y="200" class="sm" text-anchor="middle">a treasury and a governance fight.</text><circle cx="480" cy="252" r="13" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><path d="M474 246L486 258M486 246L474 258" stroke="#16150f" stroke-width="2.2"/><rect x="650" y="84" width="260" height="210" fill="#f4b728" stroke="#16150f" stroke-width="2"/><text x="780" y="126" class="sb" text-anchor="middle">Reissue algorithmically</text><text x="780" y="176" class="sm" text-anchor="middle">Returned through future block</text><text x="780" y="200" class="sm" text-anchor="middle">subsidies. Nobody decides.</text><circle cx="780" cy="252" r="13" fill="#f4b728" stroke="#16150f" stroke-width="2"/><path d="M774 252L779 257L786 247" fill="none" stroke="#16150f" stroke-width="2.2"/><text x="480" y="342" class="sm" text-anchor="middle">ZIP 233 takes the third path: "automatically and algorithmically reissued".</text></svg>