<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 326" width="960" height="326" role="img" aria-labelledby="t d">
<title id="t">Sync and broadcast happen in separate background windows</title><desc id="d">Background windows alternate between syncing and broadcasting so that a server cannot pair a wallet sync with a migration transaction.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker></defs>
<rect width="960" height="326" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}</style>
<text x="40" y="42" class="m">FIG. 8 / A BACKGROUND WINDOW DOES ONE JOB, NEVER BOTH</text><line x1="60" y1="156" x2="900" y2="156" stroke="#16150f" stroke-width="2"/><text x="900" y="262" class="m" text-anchor="end">TIME →</text><rect x="80" y="92" width="160" height="128" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="160" y="126" class="m" text-anchor="middle" style="fill:#16150f">SYNC</text><text x="160" y="164" class="sm" text-anchor="middle">update anchors</text><text x="160" y="188" class="sm" text-anchor="middle">and proofs</text><rect x="295" y="92" width="160" height="128" fill="#f4b728" stroke="#16150f" stroke-width="2"/><text x="375" y="126" class="m" text-anchor="middle" style="fill:#16150f">BROADCAST</text><text x="375" y="164" class="sm" text-anchor="middle">send one</text><text x="375" y="188" class="sm" text-anchor="middle">transfer</text><rect x="510" y="92" width="160" height="128" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="590" y="126" class="m" text-anchor="middle" style="fill:#16150f">SYNC</text><text x="590" y="164" class="sm" text-anchor="middle">update anchors</text><text x="590" y="188" class="sm" text-anchor="middle">and proofs</text><rect x="725" y="92" width="160" height="128" fill="#f4b728" stroke="#16150f" stroke-width="2"/><text x="805" y="126" class="m" text-anchor="middle" style="fill:#16150f">BROADCAST</text><text x="805" y="164" class="sm" text-anchor="middle">send one</text><text x="805" y="188" class="sm" text-anchor="middle">transfer</text><text x="480" y="300" class="sm" text-anchor="middle">If both happened in one session, the light wallet server could pair the sync with the transaction.</text></svg>