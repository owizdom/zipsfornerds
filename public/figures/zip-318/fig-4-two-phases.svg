<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 358" width="960" height="358" role="img" aria-labelledby="t d">
<title id="t">The two phases of a ZIP 318 migration</title><desc id="d">Phase 1 prepares exact-value notes privately inside Orchard. Phase 2 pre-signs the transfers and broadcasts them one at a time on a random schedule.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker></defs>
<rect width="960" height="358" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}</style>
<text x="40" y="42" class="m">FIG. 4 / THE TWO PHASES OF A ZIP 318 MIGRATION</text><rect x="40" y="70" width="410" height="262" fill="none" stroke="#16150f" stroke-width="2"/><text x="60" y="102" class="m">PHASE 1 · FULLY SHIELDED</text><text x="60" y="134" class="sb">Note preparation</text><text x="60" y="170" class="sm">1. Pick the standard amounts</text><text x="60" y="198" class="sm">2. Send-to-self inside Orchard so one</text><text x="82" y="220" class="sm">note exists per amount (plus its fee)</text><text x="60" y="248" class="sm">3. 16 actions per transaction,</text><text x="82" y="270" class="sm">spaced about 20 minutes apart</text><text x="60" y="310" class="m">ONLY TIMING AND SIZE ARE VISIBLE</text><line x1="450" y1="200" x2="506" y2="200" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><rect x="510" y="70" width="410" height="262" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="530" y="102" class="m">PHASE 2 · AMOUNTS PUBLIC</text><text x="530" y="134" class="sb">Scheduled transfers</text><text x="530" y="170" class="sm">1. Sign every transfer once, up front</text><text x="530" y="198" class="sm">2. Shuffle, then space them with random</text><text x="552" y="220" class="sm">gaps averaging 66 blocks</text><text x="530" y="248" class="sm">3. A background task attaches a shared</text><text x="552" y="270" class="sm">anchor and broadcasts, one at a time</text><text x="530" y="310" class="m">NEVER SYNC AND BROADCAST TOGETHER</text></svg>