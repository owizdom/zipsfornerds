<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 362" width="960" height="362" role="img" aria-labelledby="t d">
<title id="t">The canonical migration transaction</title><desc id="d">An Orchard bundle padded to exactly two actions, one spend and one output that may be change or a dummy, and an Ironwood bundle with a single action carrying one standard amount.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker></defs>
<rect width="960" height="362" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}</style>
<text x="40" y="42" class="m">FIG. 6 / EVERY MIGRATION TRANSACTION HAS THIS SHAPE</text><rect x="40" y="66" width="880" height="236" fill="none" stroke="#16150f" stroke-width="2"/><text x="60" y="96" class="m">ONE TRANSACTION · FEE 15,000 ZATOSHIS · NO TRANSPARENT PARTS · LOCK_TIME 0</text><rect x="60" y="116" width="480" height="166" fill="#ebe3d2" stroke="#16150f" stroke-width="1.5"/><text x="80" y="144" class="m">ORCHARD BUNDLE · EXACTLY 2 ACTIONS</text><rect x="80" y="160" width="210" height="100" fill="#f6f1e7" stroke="#16150f" stroke-width="1.5"/><text x="185" y="202" class="sb" text-anchor="middle">Spend</text><text x="185" y="230" class="sm" text-anchor="middle">one funding note</text><rect x="310" y="160" width="210" height="100" fill="#f6f1e7" stroke="#16150f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="415" y="202" class="sb" text-anchor="middle">Output</text><text x="415" y="230" class="sm" text-anchor="middle">change, or a dummy?</text><line x1="540" y1="200" x2="616" y2="200" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><text x="578" y="186" class="m" text-anchor="middle">PUBLIC</text><rect x="620" y="116" width="280" height="166" fill="#f4b728" stroke="#16150f" stroke-width="1.5"/><text x="640" y="144" class="m" style="fill:#16150f">IRONWOOD BUNDLE · 1 ACTION</text><rect x="640" y="160" width="240" height="100" fill="#f6f1e7" stroke="#16150f" stroke-width="1.5"/><text x="760" y="202" class="sb" text-anchor="middle">Output</text><text x="760" y="230" class="sm" text-anchor="middle">one standard amount</text><text x="480" y="336" class="sm" text-anchor="middle">Nobody can tell whether the dashed output carries change. The Ironwood side is left unpadded on purpose.</text></svg>