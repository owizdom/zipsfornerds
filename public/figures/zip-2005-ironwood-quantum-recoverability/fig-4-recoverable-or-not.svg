<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 402" width="960" height="402" role="img" aria-labelledby="t d">
<title id="t">Funds move from older pools into Ironwood, where they could be recovered</title><desc id="d">Funds left in the Sprout, Sapling or Orchard pools would be inaccessible once those protocols are disabled. Transparent balances have no protocol to disable, but the ZIP still tells wallets to move them. Funds in the Ironwood pool could be recovered by a future protocol.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="402" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 4 / WHICH FUNDS COULD BE RECOVERED</text><rect x="60" y="86" width="380" height="250" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="250" y="124" class="sb" text-anchor="middle">Sprout · Sapling · Orchard</text><text x="250" y="150" class="m" text-anchor="middle">INACCESSIBLE</text><text x="250" y="196" class="sm" text-anchor="middle">Plus transparent balances,</text><text x="250" y="222" class="sm" text-anchor="middle">which the ZIP names first among</text><text x="250" y="246" class="sm" text-anchor="middle">what wallets should move.</text><circle cx="250" cy="296" r="13" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><path d="M244 290L256 302M256 290L244 302" stroke="#16150f" stroke-width="2.2"/><rect x="520" y="86" width="380" height="250" fill="#f4b728" stroke="#16150f" stroke-width="2"/><text x="710" y="124" class="sb" text-anchor="middle">Ironwood</text><text x="710" y="150" class="m" text-anchor="middle">RECOVERABLE</text><text x="710" y="196" class="sm" text-anchor="middle">Notes built the new way.</text><text x="710" y="222" class="sm" text-anchor="middle">A future Recovery Protocol</text><text x="710" y="246" class="sm" text-anchor="middle">could get these funds out.</text><circle cx="710" cy="296" r="13" fill="#f4b728" stroke="#16150f" stroke-width="2"/><path d="M704 296L709 301L716 291" fill="none" stroke="#16150f" stroke-width="2.2"/><line x1="445" y1="210" x2="512" y2="210" stroke="#c98500" stroke-width="2" marker-end="url(#arrx)"/><text x="480" y="196" class="m" text-anchor="middle">move</text><text x="480" y="378" class="sm" text-anchor="middle">The ZIP: funds left behind would be "inaccessible after their respective protocols are disabled".</text></svg>