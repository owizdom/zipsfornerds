<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412" role="img" aria-labelledby="t d">
<title id="t">Upgrading the proof system does not repair old commitments</title><desc id="d">A new proof system and a rebuilt tree replace the upper layers, but note commitments already recorded on chain remain forgeable, which breaks the Balance property.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="412" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 2 / WHY SWAPPING THE PROOF SYSTEM LATER DOES NOT WORK</text><rect x="60" y="78" width="380" height="66" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="250" y="110" class="sb" text-anchor="middle">New post-quantum proof system</text><text x="250" y="132" class="xs" text-anchor="middle">believed secure</text><rect x="60" y="158" width="380" height="66" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="250" y="190" class="sb" text-anchor="middle">Commitment tree rebuilt</text><text x="250" y="212" class="xs" text-anchor="middle">with a quantum-resistant hash</text><rect x="60" y="238" width="380" height="76" fill="#f6f1e7" stroke="#16150f" stroke-width="2" stroke-dasharray="6 5"/><text x="250" y="270" class="sb" text-anchor="middle">Old note commitments</text><text x="250" y="294" class="xs" text-anchor="middle">already on chain, already forgeable</text><circle cx="250" cy="340" r="13" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><path d="M244 334L256 346M256 334L244 346" stroke="#16150f" stroke-width="2.2"/><text x="250" y="378" class="sm" text-anchor="middle">Balance breaks here</text><line x1="470" y1="90" x2="470" y2="355" stroke="#6a665a" stroke-width="1.5" stroke-dasharray="4 5"/><text x="510" y="112" class="m" text-anchor="start">Replaced</text><text x="510" y="192" class="m" text-anchor="start">Replaced</text><text x="510" y="272" class="m" text-anchor="start">CANNOT BE REPLACED</text><text x="510" y="300" class="xs" text-anchor="start">The commitments are historical</text><text x="510" y="322" class="xs" text-anchor="start">facts. Nothing re-binds them.</text><text x="510" y="366" class="sm" text-anchor="start">An adversary can forge and spend notes</text><text x="510" y="388" class="sm" text-anchor="start">that were never in the tree.</text></svg>