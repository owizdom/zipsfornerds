<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 358" width="960" height="358" role="img" aria-labelledby="t d">
<title id="t">The shipped note change and the undesigned Recovery Protocol</title><desc id="d">ZIP 2005 has two halves: a note derivation change that shipped with NU6.3, and a Recovery Protocol that is only described in outline.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="358" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 3 / TWO HALVES OF ZIP 2005</text><rect x="50" y="80" width="400" height="210" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="250" y="114" class="m" text-anchor="middle">SHIPPED WITH NU6.3</text><text x="250" y="150" class="sb" text-anchor="middle">The note change</text><text x="250" y="186" class="sm" text-anchor="middle">Ironwood notes are derived so that</text><text x="250" y="210" class="sm" text-anchor="middle">a future protocol can verify them</text><text x="250" y="234" class="sm" text-anchor="middle">without discrete logarithms</text><circle cx="250" cy="266" r="13" fill="#f4b728" stroke="#16150f" stroke-width="2"/><path d="M244 266L249 271L256 261" fill="none" stroke="#16150f" stroke-width="2.2"/><line x1="455" y1="185" x2="505" y2="185" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><rect x="510" y="80" width="400" height="210" fill="#f6f1e7" stroke="#16150f" stroke-width="2" stroke-dasharray="6 5"/><text x="710" y="114" class="m" text-anchor="middle">NOT YET DESIGNED</text><text x="710" y="150" class="sb" text-anchor="middle">The Recovery Protocol</text><text x="710" y="186" class="sm" text-anchor="middle">Would actually get your funds out</text><text x="710" y="210" class="sm" text-anchor="middle">if the old protocols are disabled.</text><text x="710" y="234" class="xs" text-anchor="middle">"Described in outline but not in detail"</text><circle cx="710" cy="266" r="13" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><path d="M704 260L716 272M716 260L704 272" stroke="#16150f" stroke-width="2.2"/><text x="480" y="332" class="sm" text-anchor="middle">What exists today is a precondition, not a defence.</text></svg>