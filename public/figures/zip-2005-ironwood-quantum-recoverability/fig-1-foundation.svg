<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 366" width="960" height="366" role="img" aria-labelledby="t d">
<title id="t">Proofs, commitments and nullifiers all rest on the discrete logarithm problem</title><desc id="d">Three parts of a shielded transaction, proofs, note commitments and nullifiers, all depend on the same hardness assumption, so one break affects all of them.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="366" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 1 / WHAT RESTS ON THE DISCRETE LOGARITHM PROBLEM</text><rect x="70" y="80" width="230" height="92" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="185" y="118" class="sb" text-anchor="middle">Proofs</text><text x="185" y="146" class="xs" text-anchor="middle">that a note exists</text><line x1="185" y1="172" x2="185" y2="222" stroke="#16150f" stroke-width="2"/><rect x="365" y="80" width="230" height="92" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="480" y="118" class="sb" text-anchor="middle">Commitments</text><text x="480" y="146" class="xs" text-anchor="middle">that a note is what it says</text><line x1="480" y1="172" x2="480" y2="222" stroke="#16150f" stroke-width="2"/><rect x="660" y="80" width="230" height="92" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="775" y="118" class="sb" text-anchor="middle">Nullifiers</text><text x="775" y="146" class="xs" text-anchor="middle">that it is not double spent</text><line x1="775" y1="172" x2="775" y2="222" stroke="#16150f" stroke-width="2"/><rect x="70" y="224" width="820" height="74" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="480" y="258" class="sb" text-anchor="middle">The discrete logarithm problem</text><text x="480" y="282" class="xs" text-anchor="middle">hard for classical computers, tractable for a large quantum computer</text><text x="480" y="342" class="sm" text-anchor="middle">One break undermines all three at once. ZIP 2005: a single discrete logarithm is sufficient.</text></svg>