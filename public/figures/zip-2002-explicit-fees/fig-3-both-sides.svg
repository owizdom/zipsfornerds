<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 338" width="960" height="338" role="img" aria-labelledby="t d">
<title id="t">The fee is a negative entry in a transaction and a positive entry in the coinbase</title><desc id="d">For non-coinbase transactions the fee entry must be nonpositive. For coinbase transactions it must be nonnegative, representing fees collected from the block.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="338" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 3 / THE FEE IS WRITTEN DOWN ON BOTH SIDES</text><rect x="70" y="88" width="340" height="150" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="240" y="124" class="sb" text-anchor="middle">Ordinary transaction</text><text x="240" y="156" class="mi" text-anchor="middle">bundle type 5, variant 0</text><rect x="110" y="176" width="260" height="42" fill="#2a78d6"/><text x="240" y="204" class="mi" text-anchor="middle" fill="#ffffff">value MUST be nonpositive</text><line x1="418" y1="162" x2="542" y2="162" stroke="#c98500" stroke-width="2" marker-end="url(#arrx)"/><text x="480" y="148" class="m" text-anchor="middle">fee</text><rect x="548" y="88" width="340" height="150" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="718" y="124" class="sb" text-anchor="middle">Coinbase transaction</text><text x="718" y="156" class="mi" text-anchor="middle">bundle type 5, variant 0</text><rect x="588" y="176" width="260" height="42" fill="#c98500"/><text x="718" y="204" class="mi" text-anchor="middle" fill="#ffffff">value MUST be nonnegative</text><text x="480" y="286" class="sm" text-anchor="middle">No effecting data and no authorizing data: nothing to prove, nothing to sign.</text><text x="480" y="314" class="sm" text-anchor="middle">Just an entry in the value pool deltas that the consensus rules check.</text></svg>