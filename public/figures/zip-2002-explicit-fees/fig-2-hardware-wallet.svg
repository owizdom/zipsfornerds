<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" width="960" height="374" role="img" aria-labelledby="t d">
<title id="t">An explicit fee lets a signing device display the committed value</title><desc id="d">With an implicit fee a hardware wallet must recompute the fee from data it was given. With an explicit fee it can display the value committed to by the transaction id.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="374" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 2 / WHAT A SIGNING DEVICE CAN SHOW YOU</text><rect x="70" y="84" width="380" height="220" fill="#f6f1e7" stroke="#16150f" stroke-width="2" stroke-dasharray="6 5"/><text x="260" y="118" class="sb" text-anchor="middle">Implicit fee, today</text><text x="260" y="162" class="sm" text-anchor="middle">The device is handed the inputs</text><text x="260" y="186" class="sm" text-anchor="middle">and outputs, then recomputes</text><text x="260" y="210" class="sm" text-anchor="middle">the fee itself.</text><text x="260" y="248" class="xs" text-anchor="middle">It must trust that the list of</text><text x="260" y="268" class="xs" text-anchor="middle">inputs it was given is complete.</text><circle cx="260" cy="292" r="13" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><path d="M254 286L266 298M266 286L254 298" stroke="#16150f" stroke-width="2.2"/><rect x="510" y="84" width="380" height="220" fill="#f4b728" stroke="#16150f" stroke-width="2"/><text x="700" y="118" class="sb" text-anchor="middle">Explicit fee, ZIP 2002</text><text x="700" y="162" class="sm" text-anchor="middle">The fee is written in the</text><text x="700" y="186" class="sm" text-anchor="middle">transaction and committed to</text><text x="700" y="210" class="sm" text-anchor="middle">by the txid.</text><text x="700" y="248" class="xs" text-anchor="middle">The device displays the value</text><text x="700" y="268" class="xs" text-anchor="middle">it is actually signing.</text><circle cx="700" cy="292" r="13" fill="#f4b728" stroke="#16150f" stroke-width="2"/><path d="M694 292L699 297L706 287" fill="none" stroke="#16150f" stroke-width="2.2"/><text x="480" y="350" class="sm" text-anchor="middle">Changing the fee changes the txid, so what you are shown is what you authorise.</text></svg>