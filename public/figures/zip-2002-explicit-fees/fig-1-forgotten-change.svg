<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" width="960" height="408" role="img" aria-labelledby="t d">
<title id="t">A forgotten change output silently becomes an enormous fee</title><desc id="d">With an implicit fee, forgetting the change output produces a valid transaction that pays 9 ZEC to a miner instead of 0.0001 ZEC.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16150f"/></marker>
<marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<rect width="960" height="408" fill="#f6f1e7"/>
<style>.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13.5px;fill:#6a665a;letter-spacing:.05em}.mi{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:14.5px;fill:#16150f}.sb{font-family:Georgia, 'Times New Roman', serif;font-size:20px;font-weight:700;fill:#16150f}.sm{font-family:Georgia, 'Times New Roman', serif;font-size:16.5px;fill:#16150f}.xs{font-family:Georgia, 'Times New Roman', serif;font-size:14px;fill:#6a665a}</style>
<text x="40" y="42" class="m" text-anchor="start">FIG. 1 / THE SAME MISTAKE, WITH AND WITHOUT A CHANGE OUTPUT</text><text x="60" y="108" class="sb" text-anchor="start">What you meant</text><rect x="250" y="80" width="150" height="56" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="325" y="106" class="xs" text-anchor="middle">input</text><text x="325" y="126" class="mi" text-anchor="middle">10 ZEC</text><line x1="405" y1="108" x2="448" y2="108" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><rect x="455" y="80" width="170" height="56" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="540" y="104" class="xs" text-anchor="middle">to recipient</text><text x="540" y="125" class="mi" text-anchor="middle">1 ZEC</text><rect x="635" y="80" width="170" height="56" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="720" y="104" class="xs" text-anchor="middle">change to you</text><text x="720" y="125" class="mi" text-anchor="middle">8.9999 ZEC</text><rect x="815" y="80" width="170" height="56" fill="#f4b728" stroke="#16150f" stroke-width="2"/><text x="900" y="104" class="xs" text-anchor="middle">fee</text><text x="900" y="125" class="mi" text-anchor="middle">0.0001 ZEC</text><text x="60" y="278" class="sb" text-anchor="start">What you sent</text><rect x="250" y="250" width="150" height="56" fill="#ebe3d2" stroke="#16150f" stroke-width="2"/><text x="325" y="276" class="xs" text-anchor="middle">input</text><text x="325" y="296" class="mi" text-anchor="middle">10 ZEC</text><line x1="405" y1="278" x2="448" y2="278" stroke="#16150f" stroke-width="2" marker-end="url(#arr)"/><rect x="455" y="250" width="170" height="56" fill="#f6f1e7" stroke="#16150f" stroke-width="2"/><text x="540" y="274" class="xs" text-anchor="middle">to recipient</text><text x="540" y="295" class="mi" text-anchor="middle">1 ZEC</text><rect x="635" y="250" width="170" height="56" fill="#c0392b" stroke="#16150f" stroke-width="2"/><text x="720" y="274" class="xs" text-anchor="middle">fee</text><text x="720" y="295" class="mi" text-anchor="middle" fill="#ffffff">9 ZEC</text><text x="480" y="356" class="sm" text-anchor="middle">Both are valid. Nothing rejects the second one. The fee is whatever is left over.</text><text x="480" y="384" class="sm" text-anchor="middle">ZIP 2002: "it should be very hard to make mistakes."</text></svg>